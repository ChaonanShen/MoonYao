name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: MoonBit Native checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1.22

      - name: Display toolchain version
        run: moon version --all

      - name: Update Mooncakes registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check source
        run: moon check --target native

      - name: Run tests
        run: moon test --target native

      - name: Build native executable
        run: moon build --target native
